# Secret-scanning config (Track C, contract C-1).
#
# OWNERSHIP: Jesse (arbiter) owns every allowlist entry; Claude proposes,
# ChatGPT reviews. Adding an entry requires: the finding's FULL fingerprint,
# why it is a false positive, and this header updated. An entry without a
# reason is a defect, not a suppression.
#
# HARDENED 2026-08-03 after an internal crafted-repo probe proved the first
# version's unanchored path regexes silently suppressed a planted secret in
# evil/docs/.../old-image-inspect.json and in a .json.bak sibling. Paths are
# now ANCHORED and the allowlist is confined to the ONE rule that fired.

[extend]
useDefault = true

