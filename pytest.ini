[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
markers =
    real_trash_root: the test asserts the REAL per-volume trash-root derivation and writes nothing; it opts out of the tmp_path redirect (TST-1) and stays under the untouched-host guard. Derivation-only by default: fileops' trash mutators (_trash, sweep_trash, empty_trash, repair_trash_transactions, delete_trash_entry, restore_trash_entry) are monkeypatched to raise RuntimeError if called. Pass mutators="allowed" (e.g. @pytest.mark.real_trash_root(mutators="allowed")) to skip that raise for a test that genuinely calls a mutator while keeping the real derivation; the untouched-host guard still applies either way.
filterwarnings =
    ignore::DeprecationWarning
