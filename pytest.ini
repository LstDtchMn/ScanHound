[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
markers =
    real_trash_root: the test asserts the REAL per-volume trash-root derivation and writes nothing; it opts out of the tmp_path redirect (TST-1) and stays under the untouched-host guard
filterwarnings =
    ignore::DeprecationWarning
