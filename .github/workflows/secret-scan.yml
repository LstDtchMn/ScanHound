name: Secret scan

# Track C (contract C-1). Two jobs with different coverage, deliberately:
#
# * `gitleaks` (push + PR): the gitleaks-action scans ONLY the pushed/PR
#   commit range (--log-opts), NOT the full history — measured, not assumed.
#   It runs on every branch because agent/* and claude/* work happens
#   without PRs, and a secret pushed there is exactly as leaked.
# * `full-history-baseline` (weekly + manual): re-validates the ENTIRE
#   repository history with `gitleaks detect` over a full clone, which is
#   what the 2026-07-31 review did once by hand (703 commits, 2 reviewed
#   FPs). Without this job the clean-history claim decays silently.
#
# Versions are PINNED (action by commit SHA, gitleaks by version) because an
# internal probe measured rule-set drift between gitleaks versions: 8.24.3
# flags bare AWS AKIA keys, 8.30.1 does not. The allowlist lives in
# .gitleaks.toml (auto-discovered from the repo root; anchored paths +
# targetRules — see its header).
#
# Recorded limitations (deferred, deliberate): a push event with no commits
# (new branch at an existing SHA, tag push) exits green having scanned
# nothing; PR-event scans read at most the first 30 commits of a PR; the
# action's license gate depends on this repo living under a USER account;
# nothing yet alerts if this workflow is disabled or fails unseen (candidate
# Uptime-Kuma hook), and preventive controls (pre-commit `gitleaks protect`,
# GitHub push protection) are tracked in docs/security/true-positive-response.md.

on:
  push:
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 4 * * 1'   # weekly full-history baseline, Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned: v2.3.9. A floating tag on a security-critical third-party
      # action is how both the action's code and its default gitleaks
      # version can change underneath you.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          # No PR comments: `permissions` grants contents:read only, and the
          # action's comment path makes an uncaught API call that would fail
          # the job exactly when leaks are found on a PR.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # No SARIF artifact on a public repo: even redacted, it publishes
          # file/rule/commit/line for every finding for 90 days.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  full-history-baseline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full-history gitleaks detect (entire repo, all commits)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --no-banner --exit-code 2 -v
