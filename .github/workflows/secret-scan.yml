name: Secret scan

# Track C (contract C-1): scanning runs on EVERY push and PR, all branches -
# long-lived work happens on agent/* and claude/* branches without PRs, and a
# secret pushed there is exactly as leaked as one pushed to main. The
# allowlist lives in .gitleaks.toml with reasons and ownership; gitleaks
# picks it up from the repo root automatically.

on:
  push:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret hidden in an earlier commit of the push is
          # still a leak even if the tip is clean.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
