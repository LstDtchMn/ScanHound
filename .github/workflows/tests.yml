name: Tests

on:
  push:
    # agent/** and fix/** are included deliberately. Long-lived work happens on
    # those branches, often without an open PR, so they previously produced NO
    # status checks at all — a reviewer inspecting a pushed head found nothing
    # machine-attested, and every figure was locally produced. On 2026-08-01 a
    # locally misconfigured harness reported three successive wrong failure
    # counts before anyone noticed; CI reproduces the real environment and
    # would have caught it on the first run.
    branches: [main, master, develop, 'agent/**', 'fix/**']
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # README supports Python 3.11 or higher; production currently runs 3.12.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install test-only dependencies (no GUI/browser packages)
          pip install pytest pytest-cov pytest-asyncio
          # Install backend dependencies that tests actually need
          pip install requests aiohttp cloudscraper beautifulsoup4
          pip install thefuzz rapidfuzz python-dotenv packaging
          pip install selenium PlexAPI
          # FastAPI web stack: the API/WS/auth test modules import
          # fastapi.testclient (needs httpx) and bcrypt; without these the
          # whole tests/test_api_*.py set errors out at collection.
          pip install fastapi "uvicorn[standard]" httpx "bcrypt>=4.0.0,<5.0" websockets
          # plyer for desktop notifications (optional, tests mock it)
          pip install plyer

      - name: Run tests
        run: |
          python -m pytest tests/ --tb=short -q

      - name: Verify safety tests still discriminate (mutation check)
        # Runs only where the harness exists, so the workflow stays valid on
        # branches that predate it.
        #
        # A passing suite proves the tests pass. It does NOT prove they would
        # FAIL on the defect they were written for — and a test that cannot
        # distinguish correct from incorrect behaviour is worse than no test,
        # because it looks like validation. This restores each known defect and
        # requires the guarding test to fail.
        if: matrix.python-version == '3.12'
        run: |
          if [ -f tests/tools/mutation_check.py ]; then
            python tests/tools/mutation_check.py
          else
            echo "no mutation harness on this branch — skipping"
          fi

      - name: Report leaked threads (informational)
        # Does not fail the build. A leaked background thread caused a real
        # flaky test on 2026-08-01 by constructing an HTTP client inside
        # another test's monkeypatch window; surfacing leaks makes the next one
        # visible before it becomes a mystery.
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: |
          if [ -f tests/tools/threadleak.py ]; then
            cp tests/tools/threadleak.py threadleak.py
            python -m pytest tests/ -q -p threadleak -p no:cacheprovider \
              2>&1 | sed -n '/THREADLEAK/,$p' | head -60
          else
            echo "no thread-leak probe on this branch — skipping"
          fi

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/ --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=40 -q

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Python (for the Playwright webServer backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies (for the Playwright webServer)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81"
          grep -v undetected-chromedriver requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
