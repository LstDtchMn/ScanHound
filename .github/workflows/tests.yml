name: Tests

on:
  push:
    # agent/**, fix/**, feat/** and docs/** are included deliberately. Long-lived
    # work happens on those branches, often without an open PR, so they otherwise
    # produce NO status checks at all -- a reviewer inspecting a pushed head finds
    # nothing machine-attested and every figure is locally produced. This branch
    # went six commits with zero CI runs for exactly that reason.
    #
    # feat/** was added 2026-08-15 after the same gap reappeared: a STACKED PR
    # (feat/dv-tag-set -> fix/dv-vocab-gap) matched neither this list nor the
    # pull_request filter below, so the largest change of the day -- a rewrite of
    # how labels are written to the live Plex library -- was about to be merged
    # with zero CI. Locally it was green and mutation-verified; none of that is
    # visible to anyone but its author.
    branches: [main, master, develop, 'agent/**', 'fix/**', 'feat/**', 'docs/**']
  pull_request:
    # '**' rather than the three long-lived branches: a PR whose BASE is another
    # feature branch is exactly the case that slipped through, and a stack is
    # where an untested change is most likely to hide.
    branches: ['**']
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # README supports Python 3.11 or higher; production currently runs 3.12.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install test-only dependencies (no GUI/browser packages)
          pip install pytest pytest-cov pytest-asyncio
          # Install backend dependencies that tests actually need
          pip install requests aiohttp cloudscraper beautifulsoup4
          pip install thefuzz rapidfuzz python-dotenv packaging
          pip install selenium PlexAPI
          # FastAPI web stack: the API/WS/auth test modules import
          # fastapi.testclient (needs httpx) and bcrypt; without these the
          # whole tests/test_api_*.py set errors out at collection.
          pip install fastapi "uvicorn[standard]" httpx "bcrypt>=4.0.0,<5.0" websockets
          # plyer for desktop notifications (optional, tests mock it)
          pip install plyer

      - name: Run tests
        run: |
          python -m pytest tests/ --tb=short -q

      - name: Qualification bundle self-test
        # Stdlib-only, seconds to run — and unowned until now. This self-test
        # sat FAILING through three schema pin bumps (fixture at 6 while the
        # pin advanced 7 -> 8 -> 9) because nothing executed it automatically;
        # it was found only when a review made someone run it by hand. A
        # validation program without an automated owner rots silently
        # (peer review of #70).
        run: |
          python docs/feature-pack-review/qualification/scripts/selftest.py

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/ --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=40 -q

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Python (for the Playwright webServer backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies (for the Playwright webServer)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81"
          grep -v undetected-chromedriver requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install httpx

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
