# Dolby Vision enhancement-layer badges for Kometa.
#
# ============================================================================
# THIS FILE MIRRORS WHAT KOMETA ACTUALLY LOADS. Do not redesign it here.
# ============================================================================
#
# Verified 2026-08-24 against `/config/dv-layer.yml` in the running `kometa`
# container. That path -- NOT this filename -- is what Kometa reads; see
# `/config/config.yml` line 79.
#
# WHY THIS WARNING EXISTS. Until 2026-08-24 this file described a completely
# different design: TEXT overlays anchored top-LEFT. Nothing deployed had ever
# looked like that. A developer trusted it, placed the version-count badges
# top-RIGHT to avoid the DV badge, and shipped them drawing at exactly the DV
# badge's coordinates -- because the real DV badge is top-RIGHT too. The
# collision is recorded in tests/test_version_labeler.py, whose
# `DV_TOP, DV_HEIGHT = 15, 96` constants are taken from the DEPLOYED file and
# are what `test_the_badges_do_not_draw_over_the_DV_badge` measures clearance
# against.
#
# So: a stale copy here is not harmless documentation. It is a trap that has
# already cost one shipped defect. `tests/test_kometa_dv_badges.py` now pins
# this file to those same constants so the two cannot drift again.
#
# ---------------------------------------------------------------------------
# THE TAG SET, AND WHY ONLY TWO ARE BADGED
# ---------------------------------------------------------------------------
#
# ScanHound applies these labels (backend/rename/dv_labeler.py):
#
#     verdict           labels applied            badged here?
#     fel               DV FEL, DV7, DV           DV FEL  -> yes
#     mel               DV MEL, DV7, DV           DV MEL  -> yes
#     profile8          DV8, DV                   DV8     -> NO IMAGE YET
#     profile5          DV5, DV                   DV5     -> NO IMAGE YET
#     none + Plex HDR   HDR10                     HDR10   -> NO IMAGE YET
#
# `DV7` and `DV` are deliberately NOT badges. They are group tags for
# FILTERING -- collections and smart filters, where one tag beats enumerating
# four. A group tag earns its place only when it spans more than one badge:
# Profile 7 does (FEL + MEL), so `DV7` is worth having; Profiles 8 and 5 are a
# single badge each, so a `DV8` group tag beside a `DV8` badge is a pure alias.
#
# THE OPEN GAP: `DV8`, `DV5` and `HDR10` are applied to Plex and render NOTHING,
# because this design uses pre-rendered PNG pills and only two exist:
#
#     /config/badges/dv-fel.png
#     /config/badges/dv-mel.png
#
# Closing it needs three more images in the same 250x96 geometry, then three
# blocks here copying the pattern below. Text overlays would work without new
# images but would break the "pixel-perfect, no font-resolution surprises"
# property this design was chosen for -- that is a decision, not a detail, and
# it is Jesse's.
#
# ---------------------------------------------------------------------------
# GEOMETRY
# ---------------------------------------------------------------------------
#
# Top-right, offsets 15/15, images 250x96 -> the badge occupies y = 15..111.
# Top-right clears the top-left ratings row and the bottom resolution badge.
# Kometa's own resolution overlay already shows a generic "DV" plus HDR10+/HDR
# along the bottom; this adds the FEL-vs-MEL distinction Plex cannot detect.
#
# Anything else drawn top-right must start at or below y=111.

overlays:
  DV FEL:
    plex_search:
      all:
        label: DV FEL
    overlay:
      name: DV FEL
      file: /config/badges/dv-fel.png
      horizontal_align: right
      vertical_align: top
      horizontal_offset: 15
      vertical_offset: 15
  DV MEL:
    plex_search:
      all:
        label: DV MEL
    overlay:
      name: DV MEL
      file: /config/badges/dv-mel.png
      horizontal_align: right
      vertical_align: top
      horizontal_offset: 15
      vertical_offset: 15
