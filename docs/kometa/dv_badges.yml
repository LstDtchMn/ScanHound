# ScanHound — Dolby Vision layer badges for Kometa.
#
# Label-gated overlays: each block badges movies carrying exactly one of the four
# labels ScanHound manages ("DV FEL", "DV MEL", "DV8", "DV5"). These label
# strings MUST match ScanHound's dv_label_vocab values exactly, or nothing badges.
# (Verified against backend/rename/dv_labeler.py's MANAGED set and
# backend/config.py's dv_label_vocab default at commit 01431c5 — both are
# {"fel": "DV FEL", "mel": "DV MEL", "profile8": "DV8", "profile5": "DV5"}.)
#
# Drop this file into your Kometa config and reference it from a Movies library, e.g.:
#
#   libraries:
#     Movies:
#       overlay_files:
#         - file: config/dv_badges.yml
#
# Kometa applies overlays on its own schedule; run it AFTER ScanHound's
# host detector walk -> POST /rename/dv-import -> POST /rename/dv-sync-labels.
# See scripts/host-detector/README.md for the full ordering and the rollout
# gate that must be cleared before the first real label sync.

#
# RENAMED 2026-08-15: "DV P8" -> "DV8", "DV P5" -> "DV5". ScanHound keeps the old
# names in RETIRED_LABELS so the next sync REMOVES them from your library; update
# this file (or re-copy it) at the same time, or those posters lose their badge.
#
# NOT badged here, deliberately: DV7 (any Profile 7) and DV (any Dolby Vision).
# Every block below draws at the same top-left corner, so badging those beside a
# layer badge would stack three overlapping labels on one poster. They exist for
# FILTERING -- collections, smart filters, "all Profile 7" rules -- where one tag
# beats enumerating four. Badge them by adding a block with a different offset.
# HDR10 IS badged below: those movies carry no DV label, so it cannot collide.

overlays:
  DV FEL:
    overlay:
      name: text(DV FEL)
      horizontal_offset: 15
      horizontal_align: left
      vertical_offset: 15
      vertical_align: top
      font_color: "#FFFFFF"
      back_color: "#00000099"
      back_width: 200
      back_height: 80
      back_radius: 30
    plex_search:
      all:
        label: DV FEL

  DV MEL:
    overlay:
      name: text(DV MEL)
      horizontal_offset: 15
      horizontal_align: left
      vertical_offset: 15
      vertical_align: top
      font_color: "#FFFFFF"
      back_color: "#00000099"
      back_width: 200
      back_height: 80
      back_radius: 30
    plex_search:
      all:
        label: DV MEL

  DV8:
    overlay:
      name: text(DV8)
      horizontal_offset: 15
      horizontal_align: left
      vertical_offset: 15
      vertical_align: top
      font_color: "#FFFFFF"
      back_color: "#00000099"
      back_width: 200
      back_height: 80
      back_radius: 30
    plex_search:
      all:
        label: DV8

  DV5:
    overlay:
      name: text(DV5)
      horizontal_offset: 15
      horizontal_align: left
      vertical_offset: 15
      vertical_align: top
      font_color: "#FFFFFF"
      back_color: "#00000099"
      back_width: 200
      back_height: 80
      back_radius: 30
    plex_search:
      all:
        label: DV5

  HDR10:
    overlay:
      name: text(HDR10)
      horizontal_offset: 15
      horizontal_align: left
      vertical_offset: 15
      vertical_align: top
      font_color: "#FFFFFF"
      back_color: "#00000099"
      back_width: 200
      back_height: 80
      back_radius: 30
    plex_search:
      all:
        label: HDR10

  # ---------------------------------------------------------------------------
  # TRANSITIONAL, remove once converged. Peer review 2026-08-15 recommended a
  # both-names window for the DV P8 -> DV8 / DV P5 -> DV5 rename:
  #
  #   1. Kometa accepts old AND new names   <-- these two blocks
  #   2. run ScanHound to convergence (it removes the old labels)
  #   3. verify a clean Kometa pass
  #   4. delete these two blocks
  #
  # Without them, ~220 Profile 8/5 posters show no DV badge between ScanHound's
  # first post-rename sync and Kometa's next run. Harmless while both exist: a
  # title carries either the old or the new label, never both, because
  # ScanHound removes the retired name in the same pass it adds the new one.
  DV P8 (retiring):
    overlay:
      name: text(DV8)
      horizontal_offset: 15
      horizontal_align: left
      vertical_offset: 15
      vertical_align: top
      font_color: "#FFFFFF"
      back_color: "#00000099"
      back_width: 200
      back_height: 80
      back_radius: 30
    plex_search:
      all:
        label: DV P8

  DV P5 (retiring):
    overlay:
      name: text(DV5)
      horizontal_offset: 15
      horizontal_align: left
      vertical_offset: 15
      vertical_align: top
      font_color: "#FFFFFF"
      back_color: "#00000099"
      back_width: 200
      back_height: 80
      back_radius: 30
    plex_search:
      all:
        label: DV P5
